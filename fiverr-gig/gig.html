<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:769px;overflow:hidden;font-family:"Inter","DejaVu Sans",Arial,sans-serif;
 background:radial-gradient(circle at 78% 40%,#1d3b8f 0%,#0d1b45 40%,#070d24 100%);color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:420px;height:420px;background:#3b82f6;opacity:.35;right:120px;top:120px}
.g2{width:300px;height:300px;background:#22d3ee;opacity:.25;left:-60px;bottom:-60px}
.left{position:absolute;left:80px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
.tag{display:inline-block;align-self:flex-start;font-size:15px;letter-spacing:3px;font-weight:700;color:#67e8f9;border:1.5px solid rgba(103,232,249,.5);padding:8px 16px;border-radius:30px;margin-bottom:26px}
h1{font-size:68px;line-height:1.02;font-weight:800;letter-spacing:-1.5px}
h1 span{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;color:transparent}
.chips{display:flex;flex-direction:column;gap:14px;margin-top:40px;width:330px}
.chip{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 16px;font-size:19px;font-weight:600}
.chip i{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.chip svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.laptop{position:absolute;left:640px;top:140px;width:540px}
.screen{height:340px;background:#0b1430;border:12px solid #1e2440;border-bottom-width:16px;border-radius:18px 18px 0 0;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.base{height:20px;background:linear-gradient(#c7cde0,#8a92ab);border-radius:0 0 22px 22px;margin:0 -40px;position:relative}
.base:after{content:"";position:absolute;left:50%;top:0;width:110px;height:7px;margin-left:-55px;background:#6b7290;border-radius:0 0 8px 8px}
.site{height:100%;background:#fff;display:flex;flex-direction:column}
.nav{height:30px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid #eef}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#3b82f6,#22d3ee)}
.nav b{height:7px;width:40px;background:#d6dbea;border-radius:4px}
.nav .btn{margin-left:auto;width:62px;height:16px;border-radius:8px;background:#2563eb}
.hero{flex:1;display:flex;padding:22px 20px;gap:18px;background:linear-gradient(135deg,#eef4ff,#e0f7fb)}
.hl{flex:1}
.hl .l1{height:16px;width:85%;background:#0f1d4a;border-radius:5px;margin-bottom:9px}
.hl .l2{height:16px;width:60%;background:#2563eb;border-radius:5px;margin-bottom:16px}
.hl .t{height:6px;background:#b8c1d9;border-radius:3px;margin-bottom:7px}
.hl .cta{margin-top:16px;width:100px;height:26px;border-radius:13px;background:linear-gradient(90deg,#2563eb,#06b6d4)}
.hr{width:190px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#06b6d4);position:relative;overflow:hidden}
.hr:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);right:-30px;top:-30px}
.cards{display:flex;gap:12px;padding:14px 20px;background:#fff}
.cards div{flex:1;height:58px;border-radius:9px;background:#f2f5fc;border:1px solid #e3e8f4}
/* profile booklet */
.doc{position:absolute;width:200px;height:278px;border-radius:8px;box-shadow:0 30px 70px rgba(0,0,0,.6);overflow:hidden;background:#fff}
.d1{left:560px;top:410px;transform:rotate(-10deg)}
.d2{left:610px;top:395px;transform:rotate(-2deg)}
.dtop{height:145px;background:linear-gradient(135deg,#0f1d4a,#2563eb 70%,#06b6d4);position:relative;overflow:hidden}
.d1 .dtop{background:linear-gradient(135deg,#f59e0b,#db2777);height:100%}
.dtop:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;border:22px solid rgba(255,255,255,.14);right:-55px;top:-45px}
.dlogo{position:absolute;left:18px;top:18px;width:26px;height:26px;border-radius:7px;background:#fff}
.dtitle{position:absolute;left:18px;bottom:20px}
.dtitle i{display:block;height:13px;width:115px;background:#fff;border-radius:3px;margin-bottom:7px}
.dtitle b{display:block;height:7px;width:70px;background:#67e8f9;border-radius:3px}
.dbody{padding:16px 18px}
.dbody i{display:block;height:6px;background:#cfd6e6;border-radius:3px;margin-bottom:7px}
.dstats{display:flex;gap:8px;margin-top:12px}
.dstats div{flex:1;height:44px;border-radius:7px;background:#eef3ff;border-top:3px solid #2563eb}
.dstats div:nth-child(2){border-color:#06b6d4}.dstats div:nth-child(3){border-color:#f59e0b}
/* phone landing page */
.phone{position:absolute;left:1030px;top:270px;width:165px;height:330px;background:#11162e;border-radius:30px;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 2px #2c355c}
.ps{height:100%;border-radius:22px;background:#fff;overflow:hidden;padding-top:26px;position:relative}
.notch{position:absolute;top:7px;left:50%;width:50px;height:12px;margin-left:-25px;background:#11162e;border-radius:8px}
.lh{margin:0 10px;height:118px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);padding:14px 12px}
.lh i{display:block;height:9px;width:80%;background:#fff;border-radius:3px;margin-bottom:6px}
.lh i+i{width:55%;opacity:.7}
.lh b{display:block;margin-top:18px;width:70px;height:18px;border-radius:9px;background:#f59e0b}
.lf{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px}
.lf div{height:50px;border-radius:9px;background:#f0f4fc;border:1px solid #e1e7f3}
.lt{margin:0 10px}.lt i{display:block;height:6px;background:#d1d8e8;border-radius:3px;margin-bottom:6px}
.badge{position:absolute;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 35px rgba(0,0,0,.45)}
.badge svg{stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.b1{left:1120px;top:100px;width:66px;height:66px;background:linear-gradient(135deg,#7c3aed,#db2777)}
.b2{left:670px;top:85px;width:62px;height:62px;background:linear-gradient(135deg,#f59e0b,#ea580c)}
.b3{left:900px;top:575px;width:60px;height:60px;background:linear-gradient(135deg,#22c55e,#0891b2)}
.dots{position:absolute;left:1180px;top:660px;width:70px;height:70px;background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2px);background-size:14px 14px}
</style></head><body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>

<div class="left">
  <div class="tag">DESIGN · LAUNCH · GROW</div>
  <h1>Your Brand,<br>Online &amp;<br><span>On Point.</span></h1>
  <div class="chips">
    <div class="chip"><i style="background:#f59e0b"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h5"/></svg></i>Company Profiles</div>
    <div class="chip"><i style="background:#2563eb"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8"/></svg></i>Landing Pages</div>
    <div class="chip"><i style="background:#7c3aed"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></i>Business Websites</div>
  </div>
</div>

<div class="laptop">
  <div class="screen"><div class="site">
    <div class="nav"><div class="logo"></div><b></b><b></b><b></b><div class="btn"></div></div>
    <div class="hero"><div class="hl"><div class="l1"></div><div class="l2"></div><div class="t"></div><div class="t" style="width:90%"></div><div class="t" style="width:70%"></div><div class="cta"></div></div><div class="hr"></div></div>
    <div class="cards"><div></div><div></div><div></div></div>
  </div></div>
  <div class="base"></div>
</div>

<div class="doc d1"><div class="dtop"><div class="dlogo"></div></div></div>
<div class="doc d2">
  <div class="dtop"><div class="dlogo"></div><div class="dtitle"><i></i><b></b></div></div>
  <div class="dbody"><i></i><i style="width:85%"></i><i style="width:60%"></i>
    <div class="dstats"><div></div><div></div><div></div></div></div>
</div>

<div class="phone"><div class="ps"><div class="notch"></div>
  <div class="lh"><i></i><i></i><b></b></div>
  <div class="lf"><div></div><div></div><div></div><div></div></div>
  <div class="lt"><i></i><i style="width:70%"></i></div>
</div></div>

<div class="badge b2"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></div>
<div class="badge b1"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/></svg></div>
<div class="badge b3"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></div>
<div class="dots"></div>
</body></html>
