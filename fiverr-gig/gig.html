<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:769px;overflow:hidden;font-family:"Inter","DejaVu Sans",Arial,sans-serif;
 background:radial-gradient(circle at 78% 40%,#1d3b8f 0%,#0d1b45 40%,#070d24 100%);color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:40px 40px}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
.g1{width:420px;height:420px;background:#3b82f6;opacity:.35;right:120px;top:120px}
.g2{width:300px;height:300px;background:#22d3ee;opacity:.25;left:-60px;bottom:-60px}
.left{position:absolute;left:80px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center}
.tag{display:inline-block;align-self:flex-start;font-size:15px;letter-spacing:3px;font-weight:700;color:#67e8f9;border:1.5px solid rgba(103,232,249,.5);padding:8px 16px;border-radius:30px;margin-bottom:26px}
h1{font-size:68px;line-height:1.02;font-weight:800;letter-spacing:-1.5px}
h1 span{background:linear-gradient(90deg,#60a5fa,#22d3ee);-webkit-background-clip:text;color:transparent}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.chip{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 14px;font-size:17px;font-weight:600}
.chip i{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none}
.chip svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
/* laptop */
.laptop{position:absolute;left:600px;top:150px;width:560px}
.screen{height:350px;background:#0b1430;border:12px solid #1e2440;border-bottom-width:16px;border-radius:18px 18px 0 0;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.base{height:20px;background:linear-gradient(#c7cde0,#8a92ab);border-radius:0 0 22px 22px;margin:0 -40px;position:relative}
.base:after{content:"";position:absolute;left:50%;top:0;width:110px;height:7px;margin-left:-55px;background:#6b7290;border-radius:0 0 8px 8px}
.site{height:100%;background:#fff;display:flex;flex-direction:column}
.nav{height:30px;display:flex;align-items:center;padding:0 16px;gap:10px;border-bottom:1px solid #eef}
.logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#3b82f6,#22d3ee)}
.nav b{height:7px;width:40px;background:#d6dbea;border-radius:4px}
.nav .btn{margin-left:auto;width:62px;height:16px;border-radius:8px;background:#2563eb}
.hero{flex:1;display:flex;padding:22px 20px;gap:18px;background:linear-gradient(135deg,#eef4ff,#e0f7fb)}
.hl{flex:1}
.hl .l1{height:16px;width:85%;background:#0f1d4a;border-radius:5px;margin-bottom:9px}
.hl .l2{height:16px;width:60%;background:#2563eb;border-radius:5px;margin-bottom:16px}
.hl .t{height:6px;background:#b8c1d9;border-radius:3px;margin-bottom:7px}
.hl .cta{margin-top:16px;width:100px;height:26px;border-radius:13px;background:linear-gradient(90deg,#2563eb,#06b6d4)}
.hr{width:200px;border-radius:12px;background:linear-gradient(135deg,#3b82f6,#06b6d4);position:relative;overflow:hidden}
.hr:before{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.18);right:-30px;top:-30px}
.hr:after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.15);left:20px;bottom:-30px}
.cards{display:flex;gap:12px;padding:14px 20px;background:#fff}
.cards div{flex:1;height:58px;border-radius:9px;background:#f2f5fc;border:1px solid #e3e8f4}
/* phone */
.phone{position:absolute;left:1000px;top:270px;width:170px;height:340px;background:#11162e;border-radius:30px;padding:9px;box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 2px #2c355c}
.ps{height:100%;border-radius:22px;background:linear-gradient(180deg,#1e3a8a,#0e7490);overflow:hidden;padding:24px 13px 12px;position:relative}
.ps .notch{position:absolute;top:7px;left:50%;width:50px;height:12px;margin-left:-25px;background:#11162e;border-radius:8px}
.bal{height:70px;border-radius:14px;background:rgba(255,255,255,.15);padding:11px}
.bal i{display:block;height:6px;width:45%;background:rgba(255,255,255,.55);border-radius:3px;margin-bottom:10px}
.bal b{display:block;height:15px;width:75%;background:#fff;border-radius:4px}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}
.icons div{height:38px;border-radius:11px;background:rgba(255,255,255,.18)}
.icons div:nth-child(1){background:#f59e0b}.icons div:nth-child(5){background:#22d3ee}
.rows div{height:30px;border-radius:9px;background:rgba(255,255,255,.12);margin-bottom:8px}
.pay-btn{position:absolute;left:13px;right:13px;bottom:14px;height:32px;border-radius:16px;background:#22c55e;display:flex;align-items:center;justify-content:center}
.pay-btn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
/* credit card */
.card{position:absolute;left:560px;top:470px;width:250px;height:156px;border-radius:18px;padding:20px;
 background:linear-gradient(135deg,#7c3aed,#db2777 60%,#f59e0b);box-shadow:0 25px 60px rgba(0,0,0,.55);transform:rotate(-9deg)}
.chipc{width:40px;height:30px;border-radius:6px;background:linear-gradient(135deg,#fde68a,#d4a72c)}
.num{display:flex;gap:12px;margin-top:26px}
.num i{height:8px;width:38px;background:rgba(255,255,255,.75);border-radius:4px}
.mc{position:absolute;right:18px;bottom:16px;display:flex}
.mc b{width:30px;height:30px;border-radius:50%;background:#ef4444;opacity:.95}
.mc b+b{background:#fbbf24;margin-left:-12px;opacity:.9}
.wifi{position:absolute;right:20px;top:20px;width:26px;height:26px}
/* floating badges */
.badge{position:absolute;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 15px 35px rgba(0,0,0,.45)}
.badge svg{stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.b1{left:1110px;top:110px;width:68px;height:68px;background:linear-gradient(135deg,#22c55e,#16a34a)}
.b2{left:640px;top:95px;width:62px;height:62px;background:linear-gradient(135deg,#f59e0b,#ea580c)}
.b3{left:900px;top:560px;width:58px;height:58px;background:linear-gradient(135deg,#06b6d4,#2563eb)}
.dots{position:absolute;left:1180px;top:660px;width:70px;height:70px;background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2px);background-size:14px 14px}
</style></head><body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>

<div class="left">
  <div class="tag">WEB · APPS · PAYMENTS</div>
  <h1>Websites<br>&amp; Apps<br><span>That Sell.</span></h1>
  <div class="chips">
    <div class="chip"><i style="background:#2563eb"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 21h8"/></svg></i>Landing Pages</div>
    <div class="chip"><i style="background:#7c3aed"><svg viewBox="0 0 24 24"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01"/></svg></i>Company Sites</div>
    <div class="chip"><i style="background:#0891b2"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></i>Mobile Apps</div>
    <div class="chip"><i style="background:#16a34a"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg></i>Payments</div>
  </div>
</div>

<div class="laptop">
  <div class="screen"><div class="site">
    <div class="nav"><div class="logo"></div><b></b><b></b><b></b><div class="btn"></div></div>
    <div class="hero"><div class="hl"><div class="l1"></div><div class="l2"></div><div class="t"></div><div class="t" style="width:90%"></div><div class="t" style="width:70%"></div><div class="cta"></div></div><div class="hr"></div></div>
    <div class="cards"><div></div><div></div><div></div></div>
  </div></div>
  <div class="base"></div>
</div>

<div class="card">
  <div class="chipc"></div>
  <svg class="wifi" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.2" stroke-linecap="round"><path d="M8 7a7 7 0 0 1 0 10M12 4a11 11 0 0 1 0 16M4 10a3 3 0 0 1 0 4"/></svg>
  <div class="num"><i></i><i></i><i></i><i></i></div>
  <div class="mc"><b></b><b></b></div>
</div>

<div class="phone"><div class="ps"><div class="notch"></div>
  <div class="bal"><i></i><b></b></div>
  <div class="icons"><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <div class="rows"><div></div><div></div></div>
  <div class="pay-btn"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>
</div></div>

<div class="badge b1"><svg width="34" height="34" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
<div class="badge b2"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg></div>
<div class="badge b3"><svg width="28" height="28" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></div>
<div class="dots"></div>
</body></html>
