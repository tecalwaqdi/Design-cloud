<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{background:#07080d;display:grid;place-items:center;position:relative}
.circle{position:absolute;width:880px;height:880px;border-radius:50%;background:linear-gradient(145deg,#15171f,#0b0c12);box-shadow:inset 0 0 0 4px #1f2230,inset 0 0 0 10px #0b0c12,inset 0 0 0 13px #ffb30055,0 40px 120px #000}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#ffb30030 0%,#ff6d0010 40%,transparent 70%)}
.mono{position:relative;display:flex;align-items:center;gap:34px;margin-top:-90px}
.br{font-family:'JetBrains Mono';font-weight:300;font-size:300px;color:#e8e8ef;line-height:1;margin-top:-30px}
.o{position:relative;width:250px;height:250px}
.o .ring{position:absolute;inset:0;border-radius:50%;padding:38px;background:linear-gradient(170deg,#ffe082,#ffb300 45%,#ff6d00);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;filter:drop-shadow(0 0 26px rgba(255,140,0,.5))}
.o .slash{position:absolute;left:50%;top:50%;width:34px;height:380px;border-radius:17px;background:linear-gradient(180deg,#fff3c4,#ffb300);transform:translate(-50%,-50%) rotate(24deg);box-shadow:0 0 0 12px #12141b,0 0 30px rgba(255,179,0,.6)}
.name{position:absolute;top:690px;text-align:center}
.en{font-family:Orbitron;font-weight:700;font-size:78px;letter-spacing:22px;color:#fff;margin-right:-22px}
.role{font-family:'JetBrains Mono';font-weight:700;font-size:30px;letter-spacing:12px;color:#ffb300;margin-top:14px;margin-right:-12px}
</style></head><body>
<div class="circle"></div><div class="glow"></div>
<div class="mono"><span class="br">&lt;</span><div class="o"><div class="ring"></div><div class="slash"></div></div><span class="br">&gt;</span></div>
<div class="name"><div class="en">OSAMA</div><div class="role">// DEVELOPER</div></div>
</body></html>
