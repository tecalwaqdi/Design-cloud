<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
body{background:#07080d;display:grid;place-items:center;position:relative}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,#ffb30033 0%,#ff6d0012 40%,transparent 70%)}
.circle{position:absolute;width:880px;height:880px;border-radius:50%;background:linear-gradient(145deg,#15171f,#0b0c12);box-shadow:inset 0 0 0 4px #1f2230,inset 0 0 0 10px #0b0c12,inset 0 0 0 13px #ffb30055,0 40px 120px #000}
.mono{position:relative;display:flex;align-items:center;direction:ltr;margin-top:-70px}
.br{font-family:'JetBrains Mono';font-weight:300;font-size:330px;color:#e8e8ef;line-height:1}
.alef{font-family:Ruqaa;font-weight:700;font-size:470px;line-height:1;margin:0 -10px;background:linear-gradient(170deg,#ffe082 0%,#ffb300 45%,#ff6d00 100%);-webkit-background-clip:text;color:transparent;transform:skewX(-14deg) translateY(30px);filter:drop-shadow(0 10px 30px rgba(255,140,0,.45));padding:0 30px}
.name{position:absolute;top:720px;display:flex;align-items:center;gap:26px;font-family:Cairo;font-weight:900}
.ar{font-size:64px;color:#fff}.sep{width:2px;height:54px;background:#ffb300}
.en{font-family:'JetBrains Mono';font-weight:700;font-size:40px;letter-spacing:14px;color:#ffb300}
</style></head><body>
<div class="circle"></div><div class="glow"></div>
<div class="mono"><span class="br">&lt;</span><span class="alef">أ</span><span class="br">&gt;</span></div>
<div class="name"><span class="en">OSAMA</span><span class="sep"></span><span class="ar">أسامة</span></div>
</body></html>
